name: package_info_plus_harmonyos
description: "HarmonyOS (OpenHarmony) platform implementation of the package_info_plus Flutter plugin."
version: 10.2.2
repository: https://github.com/Wayaer/harmony_flutter_packages/tree/main/package_info_plus_harmonyos
issue_tracker: https://github.com/Wayaer/harmony_flutter_packages/issues
topics:
  - flutter
  - harmonyos
  - ohos
  - package-info

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  package_info_plus_platform_interface: ^4.1.0

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  plugin:
    implements: package_info_plus
    platforms:
      ohos:
        pluginClass: PackageInfoPlusPlugin
