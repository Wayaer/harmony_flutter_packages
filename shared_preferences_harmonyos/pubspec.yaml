name: shared_preferences_harmonyos
description: "HarmonyOS (OpenHarmony) platform implementation of the shared_preferences Flutter plugin."
version: 2.5.6
repository: https://github.com/Wayaer/harmony_flutter_packages/tree/main/shared_preferences_harmonyos
issue_tracker: https://github.com/Wayaer/harmony_flutter_packages/issues
topics:
  - flutter
  - harmonyos
  - ohos
  - preferences
  - storage

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.0

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  plugin:
    implements: shared_preferences
    platforms:
      ohos:
        pluginClass: SharedPreferencesPlugin
        dartPluginClass: SharedPreferencesOhos
