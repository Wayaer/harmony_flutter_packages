name: audio_session_harmonyos
description: "HarmonyOS (OpenHarmony) platform implementation of the audio_session Flutter plugin."
version: 0.2.2
repository: https://github.com/Wayaer/harmony_flutter_packages/tree/main/audio_session_harmonyos
issue_tracker: https://github.com/Wayaer/harmony_flutter_packages/issues
topics:
  - flutter
  - harmonyos
  - ohos
  - audio

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  audio_session: ^0.2.2

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  plugin:
    implements: audio_session
    platforms:
      ohos:
        pluginClass: AudioSessionPlugin
