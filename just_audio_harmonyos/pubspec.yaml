name: just_audio_harmonyos
description: "HarmonyOS (OpenHarmony) platform implementation of the just_audio Flutter plugin."
version: 0.10.6
repository: https://github.com/Wayaer/harmony_flutter_packages/tree/main/just_audio_harmonyos
issue_tracker: https://github.com/Wayaer/harmony_flutter_packages/issues
topics:
  - flutter
  - harmonyos
  - ohos
  - audio
  - player

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  audio_session_harmonyos: ^0.2.2
  just_audio_platform_interface: ^4.6.0

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  plugin:
    implements: just_audio
    platforms:
      ohos:
        pluginClass: JustAudioOhosPlugin
