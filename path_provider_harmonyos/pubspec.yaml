name: path_provider_harmonyos
description: "HarmonyOS (OpenHarmony) platform implementation of the path_provider Flutter plugin."
version: 2.1.6
repository: https://github.com/Wayaer/harmony_flutter_packages/tree/main/path_provider_harmonyos
issue_tracker: https://github.com/Wayaer/harmony_flutter_packages/issues
topics:
  - flutter
  - harmonyos
  - ohos
  - path-provider
  - filesystem

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  path_provider_platform_interface: ^2.1.0

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  plugin:
    implements: path_provider
    platforms:
      ohos:
        pluginClass: PathProviderPlugin
        dartPluginClass: PathProviderOhos
