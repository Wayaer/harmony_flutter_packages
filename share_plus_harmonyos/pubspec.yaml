name: share_plus_harmonyos
description: "HarmonyOS (OpenHarmony) platform implementation of the share_plus Flutter plugin."
version: 13.3.1
repository: https://github.com/Wayaer/harmony_flutter_packages/tree/main/share_plus_harmonyos
issue_tracker: https://github.com/Wayaer/harmony_flutter_packages/issues
topics:
  - flutter
  - harmonyos
  - ohos
  - share

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  share_plus_platform_interface: ^7.2.0

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  plugin:
    implements: share_plus
    platforms:
      ohos:
        pluginClass: SharePlusPlugin
