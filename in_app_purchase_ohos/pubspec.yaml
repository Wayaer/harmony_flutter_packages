name: in_app_purchase_ohos
description: "HarmonyOS (OpenHarmony) platform implementation of the in_app_purchase Flutter plugin using IAP Kit."
version: 3.2.3
repository: https://github.com/Wayaer/harmony_flutter_packages/tree/main/in_app_purchase_ohos
issue_tracker: https://github.com/Wayaer/harmony_flutter_packages/issues
topics:
  - flutter
  - harmonyos
  - ohos
  - in-app-purchase
  - payments

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.15.0
  in_app_purchase_platform_interface: ^1.4.0
  json_annotation: ^4.8.0

dev_dependencies:
  build_runner: ^2.0.0
  json_serializable: ^6.3.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    implements: in_app_purchase
    platforms:
      ohos:
        pluginClass: InAppPurchasePlugin
