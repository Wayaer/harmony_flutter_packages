name: vibration_harmonyos
description: "HarmonyOS (OpenHarmony) platform implementation of the vibration Flutter plugin."
version: 3.2.1
repository: https://github.com/Wayaer/harmony_flutter_packages/tree/main/vibration_harmonyos
issue_tracker: https://github.com/Wayaer/harmony_flutter_packages/issues
topics:
  - flutter
  - harmonyos
  - ohos
  - vibration
  - haptics

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  device_info_plus_harmonyos: ^13.3.0
  vibration_platform_interface: ^0.1.1

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  plugin:
    implements: vibration
    platforms:
      ohos:
        pluginClass: VibrationPlugin
        dartPluginClass: VibrationHarmonyOS
