name: url_launcher_harmonyos
description: "HarmonyOS (OpenHarmony) platform implementation of the url_launcher Flutter plugin."
version: 6.3.3
repository: https://github.com/Wayaer/harmony_flutter_packages/tree/main/url_launcher_harmonyos
issue_tracker: https://github.com/Wayaer/harmony_flutter_packages/issues
topics:
  - flutter
  - harmonyos
  - ohos
  - url-launcher
  - browser

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  url_launcher_platform_interface: ^2.3.0

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  plugin:
    implements: url_launcher
    platforms:
      ohos:
        pluginClass: UrlLauncherPlugin
        dartPluginClass: UrlLauncherOhos
