name: image_picker_harmonyos
description: "HarmonyOS (OpenHarmony) platform implementation of the image_picker Flutter plugin."
version: 1.2.4
repository: https://github.com/Wayaer/harmony_flutter_packages/tree/main/image_picker_harmonyos
issue_tracker: https://github.com/Wayaer/harmony_flutter_packages/issues
topics:
  - flutter
  - harmonyos
  - ohos
  - image-picker
  - camera

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  image_picker_platform_interface: ^2.11.0

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  plugin:
    implements: image_picker
    platforms:
      ohos:
        pluginClass: ImagePickerPlugin
        dartPluginClass: ImagePickerOhos
