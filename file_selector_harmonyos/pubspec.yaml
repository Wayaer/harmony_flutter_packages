name: file_selector_harmonyos
description: "HarmonyOS (OpenHarmony) platform implementation of the file_selector Flutter plugin."
version: 1.1.0
repository: https://github.com/Wayaer/harmony_flutter_packages/tree/main/file_selector_harmonyos
issue_tracker: https://github.com/Wayaer/harmony_flutter_packages/issues
topics:
  - flutter
  - harmonyos
  - ohos
  - files
  - file-picker

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  file_selector_platform_interface: ^2.7.0

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  plugin:
    implements: file_selector
    platforms:
      ohos:
        pluginClass: FileSelectorPlugin
        dartPluginClass: FileSelectorOhos
